:root{--paper:#FFFCF6;--ink:#3E3A39;--coral:#F2A497;--sun:#F6D27A;--sky:#A8D3E6;--leaf:#B9DAA5;--bd:3px solid var(--ink);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:60}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;background:var(--paper);border-bottom:var(--bd);display:flex;gap:6px;padding:8px 10px;overflow-x:auto;justify-content:center}
nav a{flex:none;text-decoration:none;color:var(--ink);border:var(--bd);border-radius:999px;padding:3px 14px;font-size:15px;background:var(--paper)}
nav a:nth-child(1){background:var(--coral)}nav a:nth-child(2){background:var(--sun)}nav a:nth-child(3){background:var(--sky)}nav a:nth-child(4){background:var(--leaf)}nav a:nth-child(5){background:var(--coral)}
nav a:active{transform:translateY(2px)}
main{max-width:560px;margin:0 auto;padding:68px 14px 40px}
section{margin-top:28px}
h2{font-size:22px;margin:0 0 12px;display:inline-block;background:var(--sun);border:var(--bd);border-radius:999px;padding:0 16px}
.card{background:var(--paper);border:var(--bd);border-radius:28px;padding:16px;box-shadow:4px 4px 0 var(--ink)}
.hero{background:var(--sky);padding:0;overflow:hidden;text-align:center}
.hero svg{display:block;width:100%;height:auto;border-bottom:var(--bd)}
.hero .t{padding:14px 14px 18px;background:var(--paper)}
.hero h1{margin:0;font-size:28px;letter-spacing:1px}
.hero p{margin:2px 0 10px}
.cd{display:flex;gap:8px;justify-content:center}
.cd div{background:var(--sun);border:var(--bd);border-radius:18px;min-width:64px;padding:4px 6px;font-size:13px}
.cd b{display:block;font-size:26px;line-height:1.2}
#cdmsg{margin-top:8px;font-size:14px}
.tk{margin-bottom:14px}
.tk .lab{display:inline-block;border:var(--bd);border-radius:999px;padding:0 12px;font-size:14px;background:var(--coral)}
.tk.back .lab{background:var(--leaf)}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:10px 0 4px;text-align:center}
.row .tm{font-size:34px;line-height:1.1}.row small{display:block;font-size:14px}
.row svg{flex:1;max-width:90px;height:28px}
.tk .no{text-align:center;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;font:inherit;color:var(--ink);background:var(--paper);border:var(--bd);border-radius:22px;padding:6px 2px;cursor:pointer;line-height:1.3}
.tabs button b{display:block;font-size:20px}.tabs button span{font-size:13px}
.tabs button[aria-selected=true]{background:var(--coral);box-shadow:3px 3px 0 var(--ink)}
.tabs button:nth-child(2)[aria-selected=true]{background:var(--sky)}.tabs button:nth-child(3)[aria-selected=true]{background:var(--leaf)}
.dayh{font-size:18px;margin:0 0 10px}
.tl{position:relative;margin:0;padding:0 0 0 20px;list-style:none}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;border-left:3px dashed var(--ink)}
.tl.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.tl li{position:relative;margin-bottom:12px}
.tl li::before{content:"";position:absolute;left:-21px;top:14px;width:14px;height:14px;border:var(--bd);border-radius:50%;background:var(--sun)}
.tl li.must::before{background:var(--coral)}
.tl .it{background:var(--paper);border:var(--bd);border-radius:22px;padding:8px 12px}
.tl .it.must{background:#FFF3D6}
.tm2{font-size:14px}
.tag{display:inline-block;border:var(--bd);border-radius:999px;padding:0 10px;font-size:13px;margin-right:4px;line-height:1.5}
.c-coral{background:var(--coral)}.c-sky{background:var(--sky)}.c-leaf{background:var(--leaf)}.c-sun{background:var(--sun)}
.must-b{background:var(--coral);transform:rotate(-4deg)}
.it h4{margin:2px 0 0;font-size:17px;font-weight:400}
.note{font-size:14px;margin-top:2px}
.how{margin-top:6px;font-size:14px;border-left:3px solid var(--ink);padding-left:8px}.it.k-sky{background:#DCEEF6}.it.k-coral{background:#FBE3DE}.tl li.k-sky::before{background:var(--sky)}.tl li.k-coral::before{background:var(--coral)}.map{display:inline-block;margin:6px 6px 0 0;text-decoration:none;color:var(--ink);background:var(--leaf);border:var(--bd);border-radius:999px;padding:0 12px;font-size:13px}.warn{margin-top:6px;border:var(--bd);border-radius:16px;background:var(--sun);padding:2px 10px;font-size:14px}
.todo label{display:flex;gap:10px;align-items:center;padding:6px 0;cursor:pointer;border-bottom:2px dashed var(--ink)}
.todo label:last-child{border:0}.todo a{color:var(--ink);text-decoration:underline;text-decoration-thickness:2px}
.todo input{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;border:var(--bd);border-radius:9px;background:var(--paper);margin:0;cursor:pointer;position:relative}
.todo input:checked{background:var(--leaf)}
.todo input:checked::after{content:"";position:absolute;left:6px;top:1px;width:7px;height:13px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg)}
.todo input:checked+span{text-decoration:line-through;opacity:.55}
.prog{height:16px;border:var(--bd);border-radius:999px;background:var(--paper);overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;width:0;background:var(--leaf);border-right:var(--bd);transition:width .4s}
.hotel h3{margin:6px 0 2px;font-size:20px}
.hotel .k{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;color:var(--ink);background:var(--sky);border:var(--bd);border-radius:999px;padding:2px 16px;margin-top:12px}
footer{text-align:center;margin-top:30px;font-size:14px}
@keyframes pop{0%{transform:translateY(16px) scale(.92);opacity:0}60%{transform:translateY(-4px) scale(1.02);opacity:1}100%{transform:none}}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(18px)}}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes roll{from{transform:translateX(-14px)}to{transform:translateX(16px)}}
@keyframes sun{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.cl{animation:drift 7s ease-in-out infinite alternate}.cl2{animation:drift 9s ease-in-out infinite alternate-reverse}
.ln{transform-box:fill-box;transform-origin:50% 0;animation:sway 2.6s ease-in-out infinite alternate}
.tr{animation:roll 4s ease-in-out infinite alternate}
.sn{transform-box:fill-box;transform-origin:center;animation:sun 3s ease-in-out infinite alternate}
.bb{animation:bob 1.2s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
*,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
